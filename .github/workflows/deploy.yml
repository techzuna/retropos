name: Deploy POS

# Pushing to `deploy` is itself the intent to deploy, so there is no path
# filter here — a filter that can swallow a deploy is worse than an occasional
# redundant one.
on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      migrations_already_applied:
        description: >-
          Tick ONLY if you have already migrated the live data/app.db by hand.
          This host cannot run migrations; shipping code that expects a newer
          schema than the live database breaks the till.
        type: boolean
        default: false

# Two deploys writing the same directory interleave and leave a half-updated
# app. Queue them instead of cancelling — a cancelled upload is exactly the
# half-written state we are avoiding.
concurrency:
  group: deploy-pos
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    # The release is ~23 MB across ~850 files and FTP opens a new data
    # connection per file. Later runs send only what changed.
    timeout-minutes: 45

    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          # Needed to diff this push against its predecessor for the migration
          # guard below.
          fetch-depth: 0

      # Fail here with a readable message rather than deep inside the upload,
      # where a missing value surfaces as an authentication error.
      - name: Check deploy configuration
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_PATH: ${{ vars.FTP_REMOTE_PATH }}
        run: |
          missing=""
          [ -z "$SERVER" ]      && missing="$missing secrets.FTP_SERVER"
          [ -z "$USERNAME" ]    && missing="$missing secrets.FTP_USERNAME"
          [ -z "$PASSWORD" ]    && missing="$missing secrets.FTP_PASSWORD"
          [ -z "$REMOTE_PATH" ] && missing="$missing vars.FTP_REMOTE_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy configuration:$missing"
            echo "Settings → Secrets and variables → Actions."
            echo "  FTP_SERVER       the host that actually speaks FTP."
            echo "                   NOT a Cloudflare-proxied name — those pass"
            echo "                   HTTP/HTTPS only and drop port 21."
            echo "  FTP_REMOTE_PATH  the cPanel *application root*, e.g."
            echo "                   /restroreserve/  — NOT public_html."
            exit 1
          fi
          case "$REMOTE_PATH" in
            */) : ;;
            *) echo "::error::FTP_REMOTE_PATH must end with a slash. Got: $REMOTE_PATH"; exit 1 ;;
          esac
          # An FTP account is normally chrooted to the cPanel home, so FTP's "/"
          # already *is* /home/<user>. Giving the filesystem path here uploads
          # into /home/<user>/home/<user>/... — which succeeds, reports success,
          # and puts the app nowhere Passenger is looking.
          case "$REMOTE_PATH" in
            /home/*)
              echo "::error::FTP_REMOTE_PATH looks like a filesystem path: $REMOTE_PATH"
              echo "FTP logins are chrooted to the account home, so '/' is already"
              echo "/home/<user>. Use the path as FTP sees it — e.g."
              echo "  /restroreserve/   not   /home/you/restroreserve/"
              exit 1 ;;
          esac
          # The database and the backup JSONs under data/ hold every password
          # hash, PIN hash and customer phone number in the business. Anywhere
          # a web server serves files directly, they are one URL away.
          case "$REMOTE_PATH" in
            */public_html/*|*/public_html/)
              echo "::error::FTP_REMOTE_PATH is inside public_html: $REMOTE_PATH"
              echo "This app keeps its database, uploads and backups in data/."
              echo "Served from the web root, the backup JSONs — which contain"
              echo "every password and PIN hash — become downloadable."
              echo "Use a directory beside public_html and point the cPanel"
              echo "Node app's Application URL at your subdomain instead."
              exit 1 ;;
          esac
          # A trailing segment that looks like a hostname is almost always a
          # document root — cPanel names subdomain docroots after the domain.
          # Learned the hard way: deploying to /restroreserve.example.com/ put
          # the whole build behind an open directory listing.
          leaf=$(basename "$REMOTE_PATH")
          case "$leaf" in
            *.*.*|*.com|*.net|*.org|*.io|*.np)
              echo "::error::FTP_REMOTE_PATH looks like a document root: $REMOTE_PATH"
              echo "cPanel names a subdomain's document root after the domain,"
              echo "and anything inside one is served as static files — your"
              echo "database and backups included."
              echo "Use a plain directory that is NOT a document root, e.g."
              echo "  /restroreserve/"
              echo "and in Setup Node.js App set Application root to that"
              echo "directory while Application URL stays your subdomain."
              exit 1 ;;
          esac

      # A release whose schema is ahead of the live database is the one failure
      # this host cannot absorb: Setup Node.js App gives no shell, so
      # `prisma migrate deploy` cannot run against data/app.db. Catch it here,
      # before the upload, rather than as 500s during service.
      - name: Guard against un-applied migrations
        if: ${{ !inputs.migrations_already_applied }}
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No previous commit to compare against (first push or manual run)."
            echo "Skipping the migration check — verify by hand that the live"
            echo "data/app.db already has every migration in prisma/migrations."
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- prisma/migrations || true)
          if [ -n "$changed" ]; then
            echo "::error::This release adds or changes migrations:"
            echo "$changed" | sed 's/^/  /'
            echo ""
            echo "cPanel's Node selector has no shell, so the live database"
            echo "cannot be migrated in place. Do this instead, during a closed"
            echo "period (DEPLOY.md, 'cPanel-only hosting'):"
            echo "  1. Owner → Admin → Back up now, and keep that JSON."
            echo "  2. Download data/app.db from the host by File Manager/FTP."
            echo "  3. Locally: DATABASE_URL=file:./app.db npx prisma migrate deploy"
            echo "  4. Upload the migrated app.db back."
            echo "  5. Re-run this workflow from the Actions tab with"
            echo "     'migrations_already_applied' ticked."
            exit 1
          fi
          echo "No migration changes in this push — safe to ship."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # One source of truth for the Node major, so CI and the cPanel Node
          # selector cannot drift apart. Set the NODE_VERSION repository
          # variable to whatever cPanel is configured with. A mismatch shows up
          # as better-sqlite3 refusing to load: its prebuilt binary is per-ABI.
          node-version: ${{ vars.NODE_VERSION || 22 }}
          cache: npm

      # `npm ci` installs the lockfile exactly and fails if the two disagree.
      # The full tree, deliberately: `next build` needs tailwind, typescript and
      # the @types packages, all devDependencies. None of them run at request
      # time (DEPLOY.md, 'Releasing to a shared server').
      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Money, tenancy and PIN rules are covered here. A red suite means a bill
      # that disagrees with a report, so it blocks the deploy.
      - name: Test
        run: npm test

      # `npm run build` is `prisma generate && next build`: the generated client
      # is gitignored, so a fresh clone has nothing to compile against. No
      # environment variables are needed — every route is force-dynamic, so the
      # build never opens the database.
      - name: Build
        run: npm run build

      # Compile better-sqlite3 against an ancient glibc so it loads on hosts
      # that can neither use the published prebuilts (linked against 2.29+,
      # while CentOS/CloudLinux 7 ships 2.17) nor compile their own for want of
      # python3/make/g++. manylinux2014 IS CentOS 7, which is the point: a
      # binary built there runs on anything newer.
      #
      # Cached on the package version and Node major, so this costs minutes
      # only when one of those changes.
      - name: Cache the old-glibc native binary
        id: native-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: bsql3-${{ hashFiles('package-lock.json') }}-node${{ vars.NODE_VERSION || 22 }}

      - name: Compile better-sqlite3 for old glibc
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          NODE_MAJOR: ${{ vars.NODE_VERSION || 22 }}
        run: |
          version=$(node -p "require('./node_modules/better-sqlite3/package.json').version")
          # Build for both LTS ABIs so either cPanel Node setting works:
          # "<semver>:<abi>" pairs, read from Node's own release index.
          targets=$(curl -fsSL https://nodejs.org/dist/index.json | node -e '
            let d = ""; process.stdin.on("data", c => d += c).on("end", () => {
              const rel = JSON.parse(d);
              const out = [];
              for (const major of ["20", "22"]) {
                const r = rel.find(x => x.version.startsWith("v" + major + ".") && x.modules);
                if (r) out.push(r.version.slice(1) + ":" + r.modules);
              }
              console.log(out.join(" "));
            });')
          echo "better-sqlite3@$version for $targets"
          mkdir -p vendor
          docker run --rm -v "$PWD/vendor":/out \
            -e VERSION="$version" -e TARGETS="$targets" \
            quay.io/pypa/manylinux2014_x86_64 bash -eo pipefail -c '
              # No `set -u`: the devtoolset enable script appends to MANPATH
              # without defaulting it, killing the build before gcc is on PATH.
              export MANPATH="" INFOPATH="" PKG_CONFIG_PATH=""
              # The stock CentOS 7 gcc predates C++17.
              source /opt/rh/devtoolset-10/enable
              # Node 16 is the last official build that RUNS on glibc 2.17 —
              # Node 18+ needs 2.28, so it cannot even start in here. We only
              # need it to drive node-gyp; --target below fetches headers for
              # the real target, so the ABI of the binary is unrelated to the
              # Node executing the build.
              curl -fsSL https://nodejs.org/dist/v16.20.2/node-v16.20.2-linux-x64.tar.xz | tar -xJ -C /opt
              export PATH="/opt/node-v16.20.2-linux-x64/bin:$PATH"
              echo "builder node $(node -v) on $(ldd --version | head -1)"
              mkdir -p /build && cd /build && npm init -y >/dev/null
              # --ignore-scripts: skip the prebuild download entirely. The
              # SQLite amalgamation ships inside the package, so the sources
              # are all present without running the install script.
              npm install "better-sqlite3@$VERSION" --ignore-scripts \
                --no-audit --no-fund --loglevel=error
              cd node_modules/better-sqlite3
              for pair in $TARGETS; do
                ver=${pair%%:*}; abi=${pair##*:}
                echo "--- compiling for node v$ver (ABI $abi)"
                npx --yes node-gyp@10 rebuild --release \
                  --target="$ver" --arch=x64 --dist-url=https://nodejs.org/dist
                cp build/Release/better_sqlite3.node "/out/better_sqlite3-abi${abi}-linux-x64.node"
              done
            '
          ls -la vendor/
          # Prove it targets an old glibc — otherwise we would ship the same
          # unloadable binary the host already rejected.
          for f in vendor/*.node; do
            echo "$f needs: $(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          done

      # Assemble exactly what the host runs, as an allow-list. An exclude-list
      # would be one forgotten entry away from uploading a developer's data/
      # over the live database.
      - name: Assemble the deployable tree
        run: |
          rm -rf release && mkdir -p release

          # The built app. server.js boots Next in production mode and serves
          # from .next; src/ is NOT needed at runtime (the Prisma client is
          # bundled into .next/server — verified). cache/ is build scratch.
          cp -r .next release/.next
          # cache/ and dev/ are build and dev-server scratch (dev/ reaches
          # gigabytes on a developer's machine). node_modules/ inside .next is
          # empty after a build and only fills at boot, when Next materializes
          # native modules — better-sqlite3 among them — from the real
          # node_modules. Shipping it would send ~100 MB of the build machine's
          # binaries to a host that regenerates them anyway.
          rm -rf release/.next/cache release/.next/dev release/.next/node_modules

          cp -r public release/public
          cp server.js next.config.ts release/

          # Schema and migrations travel with the release so the live database's
          # expected shape is visible on the host, and so `prisma migrate deploy`
          # works the day this moves somewhere with a shell.
          cp -r prisma release/prisma
          cp prisma.config.ts release/

          # Preflight the panel can actually run. On a plan with no shell, the
          # "Run JS script" button executes an npm script, and this is the only
          # way to see why the app is failing without reading stderr.log by eye.
          mkdir -p release/scripts
          cp scripts/check-host.js scripts/install-native.js release/scripts/

          # The old-glibc driver, put in place by server.js at boot.
          if ls vendor/*.node >/dev/null 2>&1; then
            mkdir -p release/vendor && cp vendor/*.node release/vendor/
          else
            echo "::error::no vendored native binary was produced"
            exit 1
          fi

          # Ship WITHOUT node_modules and let cPanel's "Run NPM Install" build
          # it. better-sqlite3 is a compiled binary for one exact platform — the
          # copy on a developer's Mac is Mach-O arm64 and cannot load on the
          # host's Linux. It is also ~1,900 small files, which shared-hosting
          # FTP drops partway through.
          #
          # Runtime dependencies are enumerated from the source manifest and
          # pinned to the versions this build actually compiled against, read
          # from the installed tree rather than the manifest's ranges. Listing
          # them by hand would mean a new dependency silently missing from the
          # host after a green deploy — the app boots and dies on
          # "Cannot find module".
          node -e '
            const fs = require("fs");
            const src = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const deps = {};
            for (const name of Object.keys(src.dependencies || {})) {
              deps[name] = JSON.parse(
                fs.readFileSync(`node_modules/${name}/package.json`, "utf8")
              ).version;
            }
            // prisma.config.ts starts with `import "dotenv/config"`, so any
            // prisma command on the host needs dotenv even though nothing at
            // request time does.
            deps.dotenv = JSON.parse(
              fs.readFileSync("node_modules/dotenv/package.json", "utf8")
            ).version;
            if (!deps.next) throw new Error("next is not a dependency — refusing to ship");
            if (!deps["better-sqlite3"]) throw new Error("better-sqlite3 missing — refusing to ship");
            fs.writeFileSync("release/package.json", JSON.stringify({
              name: "restroreserve",
              version: src.version,
              private: true,
              engines: src.engines,
              scripts: {
                start: "node server.js",
                check: "node scripts/check-host.js",
                // NOTE: no apostrophes anywhere in this block. It lives inside
                // a single-quoted shell string, and one closes it early — the
                // failure looks like a JS syntax error, not a quoting bug.
                //
                // There is deliberately NO postinstall rebuild here. Forcing
                // --build-from-source on a host with no compiler makes the whole
                // npm install fail and leaves no binary at all, which is exactly
                // the state this deployment got stuck in. server.js installs a
                // vendored binary at boot instead.
              },
              dependencies: deps,
            }, null, 2) + "\n");
            console.log("pinned:", Object.entries(deps).map(([k, v]) => `${k}@${v}`).join(" "));
          '

          # Compile better-sqlite3 on the host instead of downloading a
          # prebuilt. The published prebuilts are linked against glibc 2.29+,
          # and CloudLinux/CentOS 7 hosts ship 2.17 — the module then installs
          # "successfully" and fails at load with
          #   /lib64/libm.so.6: version `GLIBC_2.29' not found
          #   ERR_DLOPEN_FAILED
          # which surfaces as every database query throwing. Compiling links
          # against whatever glibc the host actually has.
          #
          # Written here rather than at the repo root so local and CI installs
          # keep using the fast prebuilds; only the host pays the compile.
          # If the host has no compiler, Run NPM Install now fails loudly,
          # which beats a silent load error at request time.
          # No .npmrc forcing a source build: on a host with no compiler that
          # turns a working install into a failed one. The vendored binary in
          # vendor/, installed by server.js at boot, is the mechanism now.

          # Passenger restarts when tmp/restart.txt has a newer mtime than the
          # running process. Uploading files alone does NOT restart the app —
          # without this the deploy succeeds and the old code keeps serving.
          mkdir -p release/tmp
          echo "restarted by ${{ github.sha }} at $(date -u +%FT%TZ)" > release/tmp/restart.txt

      # Two ways to destroy a restaurant's data, both cheap to rule out.
      - name: Refuse to ship anything that could overwrite live data
        run: |
          if [ -e release/data ]; then
            echo "::error::release/data exists — that would overwrite the live"
            echo "database, the payment QR and every backup on the host."
            exit 1
          fi
          if find release \( -name ".env*" -o -name "*.db" \) | grep -q .; then
            echo "::error::release contains an .env or a database file:"
            find release \( -name ".env*" -o -name "*.db" \) | sed 's/^/  /'
            exit 1
          fi
          # vendor/ holds the old-glibc driver we build deliberately. A .node
          # anywhere else means a binary from the build machine leaked in, and
          # those fail to load on the host.
          stray=$(find release -name "*.node" -not -path "release/vendor/*")
          if [ -n "$stray" ]; then
            echo "::error::compiled binaries outside vendor/:"
            echo "$stray" | sed 's/^/  /'
            exit 1
          fi
          echo "Uploading $(du -sh release | cut -f1) across $(find release -type f | wc -l) files"

      # FTPS on 21, because cPanel offers FTP rather than SSH. The action keeps
      # a sync-state file on the server and uploads only what changed, so the
      # first deploy is slow and later ones are not.
      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # explicit FTPS — AUTH TLS on the normal port
          port: 21
          local-dir: ./release/
          server-dir: ${{ vars.FTP_REMOTE_PATH }}
          # Never wipe the remote first. That directory also holds data/ (the
          # live database, the payment QR, the backups), node_modules installed
          # by the panel, and the Node selector's own .htaccess. A clean slate
          # deletes the restaurant's records.
          dangerous-clean-slate: false
          # Belt and braces — none of these are built into the release tree.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/data/**
            **/.env*

      # The path checks are heuristics; this is the measurement. If the app
      # root turns out to be web-served, files we just uploaded are fetchable
      # by URL — and the next thing to land there is the database.
      - name: Check the upload is not publicly downloadable
        if: ${{ vars.APP_ORIGIN != '' }}
        env:
          ORIGIN: ${{ vars.APP_ORIGIN }}
        run: |
          # Probe several files, not one. A single probe passed a run where
          # server.js was still being served, because only package.json had
          # been tidied away — a check with a blind spot is worse than none.
          exposed=""
          for p in package.json server.js next.config.ts prisma/schema.prisma .npmrc data/app.db; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$ORIGIN/$p" || echo 000)
            echo "  https://$ORIGIN/$p -> $code"
            [ "$code" = "200" ] && exposed="$exposed $p"
          done
          if [ -n "$exposed" ]; then
            echo "::error::Publicly downloadable:$exposed"
            echo "Those are served as static files from a document root."
            echo "The dangerous one is data/app.db — it holds every password"
            echo "hash, PIN hash and customer phone number in the business."
            echo ""
            echo "Move the app root out of the document root:"
            echo "  1. Setup Node.js App → Application root: a plain directory"
            echo "     such as 'restroreserve' (NOT the subdomain folder)."
            echo "  2. Application URL stays your subdomain — Passenger routes"
            echo "     it to the app; nothing is served statically."
            echo "  3. Update the FTP_REMOTE_PATH variable to match."
            echo "  4. Delete the files already uploaded to the document root."
            exit 1
          fi
          echo "Not statically served — good."

      - name: What to check
        run: |
          {
            echo "### Deployed"
            echo "Commit \`${{ github.sha }}\` → \`${{ vars.FTP_REMOTE_PATH }}\`"
            echo ""
            echo "Passenger restarts on the new \`tmp/restart.txt\`. If the site still"
            echo "serves the old build, press **Restart** in cPanel → Setup Node.js App."
            echo ""
            echo "**After a dependency change, press _Run NPM Install_ in cPanel.**"
            echo "\`node_modules\` is installed on the server, not uploaded —"
            echo "\`better-sqlite3\` is a compiled binary that must match the host's"
            echo "platform and Node ABI. If that step errors, this host cannot run"
            echo "the app (DEPLOY.md, 'cPanel-only hosting')."
            echo ""
            echo "#### Smoke test the public URL"
            echo "1. Sign in as owner — a failure here usually means \`DATABASE_URL\`"
            echo "   points somewhere unwritable, or \`data/app.db\` was never uploaded."
            echo "2. End shift, then sign a staff member back in with their PIN."
            echo "3. Seat a table, add an item, settle it, print the bill, confirm"
            echo "   the table frees itself."
            echo "4. Owner → Admin → Back up now, and check the timestamp moves."
            echo ""
            echo "#### One-time cPanel setup"
            echo "Application root \`${{ vars.FTP_REMOTE_PATH }}\`, startup file"
            echo "\`server.js\`, Node ${{ vars.NODE_VERSION || 22 }}.x — the same major as this build,"
            echo "or better-sqlite3's prebuilt binary will not load."
            echo ""
            echo "Environment variables (panel, not files — \`.env\` is never uploaded):"
            echo '```ini'
            echo "NODE_ENV=production"
            echo "DATABASE_URL=file:/home/USER/APPROOT/data/app.db   # absolute"
            echo "SESSION_SECRET=<openssl rand -base64 32>"
            echo "APP_URL=https://pos.example.com                    # https, or the cookie isn't Secure"
            echo "TRUSTED_PROXY=1                                    # LiteSpeed/Apache sits in front"
            echo '```'
            echo ""
            echo "#### Migrations in this release"
            echo '```'
            ls prisma/migrations | grep -v migration_lock || echo "(none)"
            echo '```'
            echo "The live \`data/app.db\` must already have all of these."
          } >> $GITHUB_STEP_SUMMARY
